<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISpectra AI — Procurement Standards Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --line:#DCE1E9; --line-strong:#C3CBD8;
  --text:#18202E; --muted:#566277; --faint:#7A8598;
  --primary:#1F4B8E; --primary-ink:#153A72; --primary-tint:#E7EDF7;
  --nav:#12233F; --nav-text:#BFCADD; --nav-line:#25375A; --nav-hover:#1B2F52;
  --ok:#1B6B47; --ok-tint:#E3F1E9; --warn:#9A5209; --warn-tint:#FBEEDB; --bad:#9E2C2C; --bad-tint:#F8E5E5; --neutral-tint:#EDF0F4;
  --r-primary:#1F4B8E; --r-related:#4C5B73; --r-testing:#0D6B67; --r-safety:#9A5209; --r-normative:#5A4989;
  --mark:#FFF1B8; --focus:#2F6FD0; --overlay:rgba(10,18,32,.45);
  --font:'IBM Plex Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4','Noto Serif Devanagari',Georgia,'Times New Roman',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#151E30; --surface-2:#1A2439; --line:#27334D; --line-strong:#38466A;
    --text:#E4E9F2; --muted:#9EA9BE; --faint:#7F8BA3;
    --primary:#7BA5E8; --primary-ink:#A9C5F2; --primary-tint:#1D2C4B;
    --nav:#0A111E; --nav-text:#A9B6CD; --nav-line:#1C2942; --nav-hover:#141F33;
    --ok:#62C18F; --ok-tint:#173226; --warn:#E3A25A; --warn-tint:#37270F; --bad:#EE8A8A; --bad-tint:#3A1B1B; --neutral-tint:#1E283D;
    --r-primary:#7BA5E8; --r-related:#A3AEC3; --r-testing:#5CC7C1; --r-safety:#E3A25A; --r-normative:#B4A3EA;
    --mark:#5A4B12; --focus:#8DB4F5;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#151E30; --surface-2:#1A2439; --line:#27334D; --line-strong:#38466A;
  --text:#E4E9F2; --muted:#9EA9BE; --faint:#7F8BA3;
  --primary:#7BA5E8; --primary-ink:#A9C5F2; --primary-tint:#1D2C4B;
  --nav:#0A111E; --nav-text:#A9B6CD; --nav-line:#1C2942; --nav-hover:#141F33;
  --ok:#62C18F; --ok-tint:#173226; --warn:#E3A25A; --warn-tint:#37270F; --bad:#EE8A8A; --bad-tint:#3A1B1B; --neutral-tint:#1E283D;
  --r-primary:#7BA5E8; --r-related:#A3AEC3; --r-testing:#5CC7C1; --r-safety:#E3A25A; --r-normative:#B4A3EA;
  --mark:#5A4B12; --focus:#8DB4F5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px 16px}
.brand{padding:2px 10px 18px;border-bottom:1px solid var(--nav-line);margin-bottom:12px}
.brand b{display:block;font:600 21px/1.2 var(--serif);color:#fff;letter-spacing:.1px}
.brand span{display:block;margin-top:6px;font-size:12px;line-height:1.4;color:var(--nav-text)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--nav-text);text-align:left;padding:9px 10px;border-radius:4px;font-weight:500}
.nav button:hover{background:var(--nav-hover);color:#fff}
.nav button[aria-current="page"]{background:var(--nav-hover);color:#fff;box-shadow:inset 3px 0 0 #8FB3EA}
.nav .badge{margin-left:auto;font-size:11px;background:#8FB3EA;color:#0E2245;border-radius:9px;padding:0 7px;font-weight:600}
.side .kbnote{margin-top:auto;border-top:1px solid var(--nav-line);padding:12px 10px 0;font-size:12px;line-height:1.45}
.side .kbnote b{color:#fff;font-weight:600;display:block;margin-bottom:2px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:56px}
.top .title{font:600 17px/1.2 var(--serif);margin-right:auto}
.top .title small{display:block;font:400 12px/1.3 var(--font);color:var(--muted);margin-top:2px}
.sel{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:6px 8px;min-height:34px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;min-height:34px;color:var(--text)}
.chip-btn:hover{background:var(--surface-2)}
.session{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
.session .av{width:26px;height:26px;border-radius:50%;background:var(--primary-tint);color:var(--primary-ink);display:grid;place-items:center;font-weight:600;font-size:11px}
.page{padding:24px 28px 48px;max-width:1360px;width:100%}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-tint);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--text);border-radius:5px;padding:9px 12px;font-size:13px;margin-bottom:18px}
.banner .ic{color:var(--warn);margin-top:2px}
.banner.info{background:var(--primary-tint);border-color:color-mix(in srgb,var(--primary) 25%,transparent)}
.banner.info .ic{color:var(--primary)}
.banner.err{background:var(--bad-tint);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.err .ic{color:var(--bad)}
.banner p{flex:1}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{font:600 22px/1.25 var(--serif)}
.pagehead p{color:var(--muted);margin-top:3px;max-width:70ch}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.card>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>header h3{font:600 14px/1.3 var(--font)}
.card>header .meta{color:var(--muted);font-size:12px;margin-left:auto}
.card>header .ic{color:var(--muted)}
.card .body{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 13px;min-height:34px;font-weight:500;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-ink)}
:root[data-theme="dark"] .btn.primary{color:#0B1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1424}}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12.5px}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.ok:hover{background:var(--ok-tint)}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.no:hover{background:var(--bad-tint)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--primary);padding:2px 4px;min-height:0}
.btn.link:hover{text-decoration:underline;background:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;line-height:1;padding:4px 7px;border-radius:3px;border:1px solid transparent;white-space:nowrap}
.tag.Primary{color:var(--r-primary);background:color-mix(in srgb,var(--r-primary) 12%,transparent)}
.tag.Related{color:var(--r-related);background:color-mix(in srgb,var(--r-related) 12%,transparent)}
.tag.Testing{color:var(--r-testing);background:color-mix(in srgb,var(--r-testing) 12%,transparent)}
.tag.Safety{color:var(--r-safety);background:color-mix(in srgb,var(--r-safety) 13%,transparent)}
.tag.Normative{color:var(--r-normative);background:color-mix(in srgb,var(--r-normative) 12%,transparent)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.neutral{color:var(--faint)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--neutral-tint);color:var(--muted)}
.pill.demo{background:var(--warn-tint);color:var(--warn);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.isid{font-weight:600;color:var(--text)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.list{margin:0;padding:0;list-style:none}
.list li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list li:first-child{border-top:0;padding-top:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty h4{font:600 14px var(--font);color:var(--text);margin-bottom:4px}
.empty .btn{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12.5px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0B1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0B1424}}
.chip.ent{border-radius:3px;background:var(--surface-2);border-color:var(--line)}
button.chip:hover{background:var(--surface-2)} button.chip.on:hover{background:var(--primary-ink)}

/* workflow strip */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.flow .fs{position:relative;padding:14px 14px 14px 16px;border-left:1px solid var(--line)}
.flow .fs:first-child{border-left:0}
.flow .fs .n{display:flex;align-items:center;gap:8px;font-weight:600}
.flow .fs .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:#fff;flex:none}
.flow .fs .dot .ic{width:11px;height:11px;stroke-width:2.5}
.flow .fs.done .dot{background:var(--ok);border-color:var(--ok)}
.flow .fs.run .dot{border-color:var(--primary);border-top-color:transparent;animation:spin .9s linear infinite}
.flow .fs .s{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.4}
.flow .fs::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.flow .fs.done::after{background:var(--ok)}
.flow .fs.run::after{background:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.flow .fs.run .dot{animation:none}*{scroll-behavior:auto!important}}

/* metric strip */
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.metrics>div{padding:12px 16px;border-left:1px solid var(--line)}
.metrics>div:first-child{border-left:0}
.metrics b{display:block;font:600 22px/1.2 var(--font)}
.metrics span{color:var(--muted);font-size:12.5px}

/* standards rows */
.shead,.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 128px 92px 150px;gap:12px;align-items:center;padding:10px 16px}
.shead{background:var(--surface-2);border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:500}
.srow{border-top:1px solid var(--line);cursor:pointer;background:var(--surface)}
.srow:first-of-type{border-top:0}
.srow:hover{background:var(--surface-2)}
.srow.sel{background:var(--primary-tint);box-shadow:inset 3px 0 0 var(--primary)}
.srow .ttl{min-width:0}
.srow .ttl b{font-weight:500;display:block}
.srow .ttl small{color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.srow .acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.score{display:flex;align-items:center;gap:7px}
.score i{display:block;width:44px;height:5px;background:var(--neutral-tint);border-radius:3px;overflow:hidden}
.score i s{display:block;height:100%;background:var(--primary);text-decoration:none}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn.ok:hover{color:var(--ok);border-color:var(--ok)} .iconbtn.no:hover{color:var(--bad);border-color:var(--bad)}
.iconbtn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff} .iconbtn.no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.stdgrp{padding:9px 16px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--muted)}

/* layout with detail panel */
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.detail{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));max-height:calc(100vh - 92px);overflow:auto}
.detail .close{display:none}
.backdrop{display:none}
.section{scroll-margin-top:80px;margin-bottom:20px}
.anchors{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding:8px 0 10px;margin:-8px 0 8px;display:flex;gap:6px;flex-wrap:wrap}
.anchors a{color:var(--text);text-decoration:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:3px 11px;font-size:12.5px}
.anchors a:hover{background:var(--surface-2)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
thead+tbody tr:first-child td{border-top:0}
td.num,th.num{text-align:right}
tbody tr.clickable{cursor:pointer} tbody tr.clickable:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--primary-tint)}

/* form */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px;color:var(--muted);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--primary-ink);border-bottom-color:var(--primary)}
textarea.spec{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:10px 12px;line-height:1.55}
textarea.spec:focus{outline:2px solid var(--focus);outline-offset:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-strong);border-radius:5px;padding:18px;display:flex;gap:12px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--primary);background:var(--primary-tint)}
.drop .ic{color:var(--muted)}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.rec .ic{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
input.txt{border:1px solid var(--line-strong);border-radius:4px;padding:6px 9px;background:var(--surface);min-height:34px;width:100%}
input.txt.r{text-align:right}

/* pipeline */
.pl{list-style:none;margin:0;padding:0}
.pl li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:0 0 14px;position:relative}
.pl li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--line)}
.pl li:last-child::before{display:none} .pl li:last-child{padding-bottom:0}
.pl .d{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:#fff}
.pl .d .ic{width:12px;height:12px;stroke-width:2.5}
.pl li.done .d{background:var(--ok);border-color:var(--ok)}
.pl li.run .d{border-color:var(--primary);border-top-color:transparent;animation:spin .9s linear infinite}
.pl b{font-weight:600} .pl .sum{color:var(--muted);font-size:12.5px}
.pl ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}
.pl li.idle b{color:var(--muted);font-weight:500}

/* dialog / toast */
.modal{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;justify-content:flex-end;padding-top:env(safe-area-inset-top,0px)}
.modal .sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;border-left:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal .sheet>header{position:sticky;top:0;background:var(--surface);z-index:1;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .sheet>header h3{font:600 17px var(--serif);margin-right:auto}
.modal .sheet .body{padding:16px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:10px 16px;border-radius:5px;z-index:80;font-size:13px;max-width:min(560px,92vw);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.arch{display:grid;gap:0;margin-bottom:12px}
.arch div{border:1px solid var(--line);padding:9px 12px;font-size:13px;background:var(--surface-2)}
.arch div+div{border-top:0}
.arch div b{font-weight:600} .arch div span{color:var(--muted);display:block;font-size:12.5px}
.stack dt{font-weight:600;margin-top:12px} .stack dd{margin:2px 0 0;color:var(--muted);font-size:13px}
.stack{margin:0}

/* responsive */
@media (max-width:1179px){
  .split{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(460px,100%);max-height:none;transform:translateX(102%);visibility:hidden;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .detail.open{transform:none;visibility:visible;transition:transform .18s ease}
  .detail .close{display:inline-grid}
  .backdrop.open{display:block;position:fixed;inset:0;z-index:45;background:var(--overlay)}
  .detail.hide-empty{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:40;border-top:1px solid var(--nav-line)}
  .brand,.side .kbnote{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;flex:1;text-align:center;min-width:0}
  .nav button span.lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 3px 0 #8FB3EA}
  .nav .badge{display:none}

/* ===== engine.js ===== */
/* ===== ISpectra engine =====
   Layers mirror the architecture: pre-processing & understanding, AI engine
   (demo matcher), knowledge-base access, recommendation engine, verification.
   Every function here is pure so it can be replaced by REST calls to a
   backend service without changing the UI. */
const Engine = (() => {
  const ROLE_ORDER = ['Primary', 'Testing', 'Safety', 'Normative', 'Related'];
  const REL_TO_ROLE = { tests: 'Testing', safety: 'Safety', normative: 'Normative', related: 'Related' };
  const REL_TEXT = {
    tests: 'Test method referenced by',
    safety: 'Safety / technical standard referenced by',
    normative: 'Normative reference of',
    related: 'Related standard of'
  };

  const STOP = new Set(('a an the of and or for to in on at by with from as is are be been being this that these those it its into per ' +
    'shall should must will would can may any all each such than then also not no nor only own same so too very just now ' +
    'supply supplying supplied required requirement requirements need needs needed please provide providing including include ' +
    'etc as per quantity total building construction work site material').split(' '));

  const SYN_REPLACE = { mixed: 'mix', mixture: 'mix', mixing: 'mix', reinforcing: 'reinforcement', rod: 'bar', rmc: 'rmc' };
  const SYN_EXPAND = {
    opc: 'ordinary portland cement',
    ppc: 'portland pozzolana cement fly ash',
    tmt: 'thermo mechanically treated deformed steel reinforcement bar',
    rebar: 'reinforcement steel bar deformed',
    sariya: 'reinforcement steel bar',
    rmc: 'ready mix concrete',
    rcc: 'reinforced concrete',
    gravel: 'coarse aggregate',
    sand: 'fine aggregate',
    stone: 'aggregate',
    chip: 'aggregate',
    brickwork: 'brick masonry'
  };

  /* ---- language detection & translation ---- */
  const SCRIPTS = [
    ['Hindi (Devanagari)', 'hi', /[\u0900-\u0963\u0966-\u097F]/g],
    ['Bengali', 'bn', /[\u0980-\u09FF]/g],
    ['Punjabi (Gurmukhi)', 'pa', /[\u0A00-\u0A7F]/g],
    ['Gujarati', 'gu', /[\u0A80-\u0AFF]/g],
    ['Odia', 'or', /[\u0B00-\u0B7F]/g],
    ['Tamil', 'ta', /[\u0B80-\u0BFF]/g],
    ['Telugu', 'te', /[\u0C00-\u0C7F]/g],
    ['Kannada', 'kn', /[\u0C80-\u0CFF]/g],
    ['Malayalam', 'ml', /[\u0D00-\u0D7F]/g]
  ];

  function detectLanguage(text, hint) {
    const letters = (text.match(/[A-Za-z\u0900-\u0D7F]/g) || []).length || 1;
    let best = { name: 'English', code: 'en', share: (text.match(/[A-Za-z]/g) || []).length / letters };
    for (const [name, code, re] of SCRIPTS) {
      const n = (text.match(re) || []).length;
      if (n / letters > 0.25 && n / letters > best.share) best = { name, code, share: n / letters };
    }
    const supported = best.code === 'en' || best.code === 'hi';
    let source = 'detected';
    if (hint === 'en' || hint === 'hi') {
      if (hint !== best.code && best.share < 0.6) { best = { name: hint === 'hi' ? 'Hindi (Devanagari)' : 'English', code: hint, share: best.share }; }
      source = 'selected';
    }
    return { name: best.name, code: best.code, supported: best.code === 'en' || best.code === 'hi', share: Math.round(best.share * 100), source };
  }

  const HI_LEX_RAW = {
    'सीमेंट': 'cement', 'सीमेन्ट': 'cement', 'ओपीसी': 'OPC', 'पीपीसी': 'PPC', 'ग्रेड': 'grade', 'स्टील': 'steel', 'इस्पात': 'steel',

    'टीएमटी': 'TMT', 'ईंट': 'brick', 'ईंटें': 'bricks', 'ईंटों': 'bricks', 'ईंटो': 'bricks', 'कंक्रीट': 'concrete', 'कंक्रिट': 'concrete',
    'रेत': 'sand', 'बालू': 'sand', 'बजरी': 'gravel', 'गिट्टी': 'coarse aggregate', 'रोड़ी': 'coarse aggregate', 'रोड़ा': 'coarse aggregate',
    'रेडी': 'ready', 'मिक्स': 'mixed', 'मिश्रित': 'mixed', 'आरएमसी': 'RMC', 'मिट्टी': 'clay', 'पक्की': 'burnt', 'पकी': 'burnt',
    'आपूर्ति': 'supply', 'चाहिए': 'shall', 'चाहिये': 'shall', 'अनिवार्य': 'mandatory', 'मानक': 'standard', 'मानकों': 'standards',
    'निर्माण': 'construction', 'भवन': 'building', 'इमारत': 'building', 'पानी': 'water', 'टन': 'tonnes', 'बोरी': 'bags', 'बोरे': 'bags',
    'मजबूत': 'strong', 'मज़बूत': 'strong', 'तैयार': 'ready', 'का': '', 'की': '', 'के': '', 'को': '', 'में': 'in', 'और': 'and', 'भी': 'also',
    'लिए': 'for', 'हमें': '', 'है': '', 'हैं': '', 'से': 'from', 'पर': 'on', 'एक': 'one', 'सभी': 'all', 'प्रमाणित': 'certified',
    'विनिर्देश': 'specification', 'निविदा': 'tender', 'ठेका': 'contract', 'कार्य': 'works', 'दीवार': 'wall', 'चिनाई': 'brickwork',
    'संपीड़न': 'compressive', 'शक्ति': 'strength', 'मीट्रिक': 'metric', 'घन': 'cubic', 'मीटर': 'metre', 'मिमी': 'mm'
  };
  const HI_LEX = {};
  for (const k of Object.keys(HI_LEX_RAW)) HI_LEX[k.normalize('NFC')] = HI_LEX_RAW[k];

  function translateHindi(text) {
    const missing = [];
    const digits = text.replace(/[\u0966-\u096F]/g, d => String(d.charCodeAt(0) - 0x0966));
    const out = digits.replace(/\u0964/g, '. ').replace(/[\u0900-\u0963\u0966-\u097F]+/g, w => {
      const key = w.normalize('NFC');
      if (Object.prototype.hasOwnProperty.call(HI_LEX, key)) return HI_LEX[key];
      missing.push(w);
      return w;
    });
    return { text: out.replace(/\s+/g, ' ').trim(), untranslated: Array.from(new Set(missing)) };
  }

  /* ---- cleaning / normalisation ---- */
  function cleanText(raw) {
    return String(raw || '')
      .normalize('NFC')
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u200B-\u200D\uFEFF]/g, '')
      .replace(/(\w)-\n(\w)/g, '$1$2')
      .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-')
      .replace(/\r/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  function sentences(text) {
    return text.split(/(?<=[.!?;])\s+|\n+/).map(s => s.trim()).filter(s => s.length > 3);
  }

  /* ---- tokens ---- */
  function stem(w) {
    if (SYN_REPLACE[w]) return SYN_REPLACE[w];
    if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
    if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us') && !w.endsWith('is')) return w.slice(0, -1);
    return w;
  }
  function tokenize(text) {
    return (String(text).toLowerCase().match(/[a-z0-9]+/g) || []).map(stem)
      .filter(t => t.length > 1 && !STOP.has(t) && !/^\d+$/.test(t));
  }
  function expandTokens(tokens) {
    const out = new Set(); const expansions = [];
    for (const t of tokens) {
      out.add(t);
      if (SYN_EXPAND[t]) {
        const add = tokenize(SYN_EXPAND[t]);
        add.forEach(a => out.add(a));
        expansions.push(t + ' → ' + SYN_EXPAND[t]);
      }
    }
    return { set: out, expansions };
  }

  /* ---- entity extraction ---- */
  const PRODUCT_LEX = [
    ['Cement', /\b(cement|opc|ppc)\b/i],
    ['Reinforcement steel bars', /\b(tmt|rebars?|sariya|reinforcement\s+(?:steel\s+)?bars?|deformed\s+(?:steel\s+)?bars?|steel\s+bars?|steel\s+rods?)\b/i],
    ['Aggregates', /\b(aggregates?|gravel|crushed\s+stone|sand)\b/i],
    ['Concrete', /\b(concrete|rmc|rcc)\b/i],
    ['Bricks', /\bbricks?\b/i]
  ];
  const CITE_RE = /\bIS\b[\s.:-]*(\d{2,5})(?:\s*\(?\s*(?:Part|Pt)\.?\s*(\d+)\s*\)?)?(?:\s*(?:[:\-\/]\s*|\(\s*)((?:19|20)\d{2})\)?)?/g;

  function extractCitations(text) {
    const out = []; const seen = new Set(); let m;
    CITE_RE.lastIndex = 0;
    while ((m = CITE_RE.exec(text))) {
      const rec = { raw: m[0].replace(/\s+/g, ' ').trim(), num: m[1], part: m[2] || null, year: m[3] || null };
      const key = rec.num + '|' + (rec.part || '') + '|' + (rec.year || '');
      if (!seen.has(key)) { seen.add(key); out.push(rec); }
    }
    return out;
  }

  function uniq(a) { return Array.from(new Set(a)); }

  function extractEntities(text) {
    const products = PRODUCT_LEX.filter(([, re]) => re.test(text)).map(([n]) => n);
    const attrs = [];
    let m;
    const g1 = /\b(33|43|53)\s*[- ]?grade\b|\bgrade\s*[- ]?(33|43|53)\b/gi;
    while ((m = g1.exec(text))) attrs.push({ type: 'Cement grade', value: (m[1] || m[2]) + ' grade' });
    const fe = /\bFe\s*[- ]?(415|500|550|600)\s*(D|S|CRS)?\b/gi;
    while ((m = fe.exec(text))) attrs.push({ type: 'Steel grade', value: 'Fe ' + m[1] + (m[2] ? m[2].toUpperCase() : '') });
    const mg = /\bM\s?-?(10|15|20|25|30|35|40|45|50)\b/g;
    while ((m = mg.exec(text))) attrs.push({ type: 'Concrete grade', value: 'M' + m[1] });
    const st = /(\d+(?:\.\d+)?)\s*(MPa|N\/mm2|N\/mm²)/gi;
    while ((m = st.exec(text))) attrs.push({ type: 'Strength', value: m[1] + ' ' + m[2] });
    const dia = /(\d+(?:\.\d+)?)\s*mm\b/gi;
    while ((m = dia.exec(text))) attrs.push({ type: 'Dimension', value: m[1] + ' mm' });
    const q = /(\d[\d,]*(?:\.\d+)?)\s*(tonnes?|tons?|MT|kg|bags?|nos\.?|numbers?|cubic\s*met(?:er|re)s?|cum|m3|m³|bricks?)\b/gi;
    while ((m = q.exec(text))) attrs.push({ type: 'Quantity', value: m[1] + ' ' + m[2].toLowerCase() });
    const seen = new Set();
    const attributes = attrs.filter(a => { const k = a.type + a.value.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    const reqRe = /\b(shall|must|should|required|requirement|conform(?:s|ing)?|compl(?:y|ies|iance)|in accordance|as per|mandatory|necessary|minimum|not less than|at least)\b/i;
    const requirements = sentences(text).filter(s => reqRe.test(s)).slice(0, 8).map(s => s.length > 240 ? s.slice(0, 237) + '...' : s);
    return { products, attributes, requirements, standards: extractCitations(text) };
  }

  function detectIntent(text, products) {
    const works = /\b(construction|works?|laying|execution|erection|casting|building)\b/i.test(text);
    const purchase = /\b(supply|procure|procurement|purchase|tender|quotation|delivery|supplying)\b/i.test(text);
    const what = products.length ? products.join(', ').toLowerCase() : 'unidentified items';
    if (purchase && works) return 'Supply of materials for construction works: ' + what;
    if (purchase) return 'Procurement of ' + what;
    if (works) return 'Construction works involving ' + what;
    return 'Requirement involving ' + what;
  }

  /* ---- knowledge base access ---- */
  function indexKB(standards) {
    const byId = new Map(); const byNum = new Map();
    for (const s of standards) {
      byId.set(s.id, s);
      if (!byNum.has(s.num)) byNum.set(s.num, []);
      byNum.get(s.num).push(s);
    }
    const docs = standards.map(s => {
      const terms = new Map();
      const add = (arr, w) => arr.forEach(t => terms.set(t, Math.max(terms.get(t) || 0, w)));
      add(tokenize(s.title), 1.4); add((s.keywords || []).flatMap(k => tokenize(k)), 1.0); add(tokenize(s.scope || ''), 0.4);
      return { id: s.id, terms };
    });
    const df = new Map();
    docs.forEach(d => d.terms.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1)));
    const N = docs.length || 1; const idf = new Map();
    df.forEach((c, t) => idf.set(t, Math.log(1 + N / c)));
    const usedBy = new Map();
    for (const s of standards) for (const rel of ['tests', 'safety', 'normative', 'related']) for (const r of s[rel] || []) {
      if (!usedBy.has(r)) usedBy.set(r, []);
      usedBy.get(r).push({ id: s.id, rel });
    }
    const unresolved = [];
    for (const s of standards) for (const rel of ['tests', 'safety', 'normative', 'related']) for (const r of s[rel] || []) if (!byId.has(r)) unresolved.push({ from: s.id, ref: r, rel });
    return { list: standards, byId, byNum, docs: new Map(docs.map(d => [d.id, d])), idf, usedBy, unresolved };
  }

  function latestYear(std) { const m = /(\d{4})/.exec(std.version || ''); return m ? m[1] : null; }

  function lookupCitation(kb, c) {
    const list = kb.byNum.get(c.num) || [];
    if (!list.length) return null;
    if (c.part) return list.find(s => String(s.part) === String(c.part)) || null;
    return list.find(s => !s.part) || (list.length === 1 ? list[0] : list[0]);
  }

  function verifyCitation(kb, c) {
    const std = lookupCitation(kb, c);
    if (!std) return { ...c, kbId: null, status: 'unknown', latest: null, note: 'Not in the demo Knowledge Base, so it cannot be verified.' };
    const latest = std.version;
    const ly = latestYear(std);
    if (/multi/i.test(latest)) return { ...c, kbId: std.id, status: 'multipart', latest, note: 'Multi-part standard. Confirm the part and its year.' };
    if (!c.year) return { ...c, kbId: std.id, status: 'noyear', latest, note: 'Year not stated. Latest version in the Knowledge Base is ' + latest + '.' };
    if (c.year === ly) return { ...c, kbId: std.id, status: 'current', latest, note: 'Matches the latest version.' };
    const old = (std.history || []).find(h => h.version === c.year);
    if (old) return { ...c, kbId: std.id, status: 'outdated', latest, note: 'Version ' + c.year + ' is superseded. Latest is ' + latest + '.' };
    return { ...c, kbId: std.id, status: 'mismatch', latest, note: 'Year ' + c.year + ' is not a known version. Latest is ' + latest + '.' };
  }

  /* ---- AI engine: demo semantic matcher ---- */
  const K = 5;
  function scoreStandard(kb, std, qset, qtext, attrs) {
    const doc = kb.docs.get(std.id);
    let raw = 0; const matched = [];
    doc.terms.forEach((w, t) => { if (qset.has(t)) { raw += w * (kb.idf.get(t) || 0); matched.push(t); } });
    const phrases = (std.phrases || []).filter(p => qtext.includes(p));
    raw += phrases.length * 2.0;
    const notes = [];
    if (std.grade && raw > 0) {
      const fam = std.grade.family;
      const stated = attrs.filter(a => (fam === 'opc' && a.type === 'Cement grade') || (fam === 'fe' && a.type === 'Steel grade'))
        .map(a => parseInt(a.value.replace(/\D/g, '').slice(0, 3), 10));
      if (stated.length) {
        if (stated.some(v => std.grade.values.includes(v))) { raw += 4; notes.push({ kind: 'attr-match', text: (fam === 'opc' ? 'Stated cement grade ' : 'Stated steel grade Fe ') + stated.join(', ') + ' falls within this standard.' }); }
        else { raw *= 0.25; notes.push({ kind: 'attr-miss', text: 'Input states grade ' + stated.join(', ') + ', which this standard does not cover.' }); }
      }
    }
    const sem = 1 - Math.exp(-raw / K);
    return { sem, raw, matched, phrases, notes };
  }

  function segments(sentence, termSet) {
    const parts = sentence.split(/([A-Za-z0-9]+)/); const out = [];
    for (const p of parts) {
      if (!p) continue;
      const isWord = /^[A-Za-z0-9]+$/.test(p);
      const hit = isWord && (termSet.has(stem(p.toLowerCase())) || termSet.has(p.toLowerCase()));
      out.push({ t: p, m: !!hit });
    }
    const merged = [];
    for (const s of out) { const l = merged[merged.length - 1]; if (l && l.m === s.m) l.t += s.t; else merged.push({ ...s }); }
    return merged;
  }

  function analyse(kb, input) {
    const stages = [];
    const raw = String(input.text || '');
    const type = input.type || 'product';
    const typeLabel = { product: 'Product description', spec: 'Technical specification', tender: 'Tender document' }[type] || 'Product description';

    // 1 Input
    stages.push({ key: 'input', label: 'Input', summary: typeLabel + ' · ' + raw.length.toLocaleString('en-IN') + ' characters',
      details: [typeLabel, input.fileName ? 'File: ' + input.fileName : 'Typed, pasted or spoken text', 'Input language setting: ' + ({ auto: 'Auto-detect', en: 'English', hi: 'Hindi' }[input.langHint || 'auto'])] });

    // 2 Pre-processing
    const cleaned = cleanText(raw);
    const lang = detectLanguage(cleaned, input.langHint || 'auto');
    let translated = cleaned; let untranslated = []; let didTranslate = false;
    if (lang.code === 'hi') { const tr = translateHindi(cleaned); translated = tr.text; untranslated = tr.untranslated; didTranslate = true; }
    const entities = extractEntities(translated);
    const parse = input.parseMethod || 'Plain text';
    const pre = [
      'Document parsing: ' + parse,
      'OCR: not run in this prototype' + (input.parseMethod && /PDF/.test(input.parseMethod) ? ' (text layer used)' : ''),
      'Text cleaned and normalised',
      'Language: ' + lang.name + ' (' + lang.source + ')',
      didTranslate ? 'Translation to English: demo term lexicon' + (untranslated.length ? ', ' + untranslated.length + ' term(s) left untranslated' : '') : (lang.supported ? 'Translation: not needed' : 'Translation: no translator for ' + lang.name + ' in this prototype'),
      'Entities: ' + entities.products.length + ' product, ' + entities.attributes.length + ' attribute, ' + entities.requirements.length + ' requirement, ' + entities.standards.length + ' standard reference'
    ];
    stages.push({ key: 'pre', label: 'Pre-processing & understanding', summary: lang.name + ' · ' + (entities.products.length + entities.attributes.length + entities.requirements.length + entities.standards.length) + ' entities', details: pre });

    // 3 AI analysis
    const toks = tokenize(translated);
    const ex = expandTokens(toks);
    const intent = detectIntent(translated, entities.products);
    stages.push({ key: 'ai', label: 'AI analysis', summary: intent,
      details: ['Context and intent: ' + intent, ex.set.size + ' distinct concepts after normalisation', ex.expansions.length ? 'Concept expansion: ' + ex.expansions.join('; ') : 'No abbreviations expanded', 'Demo matcher stands in for LLM embeddings and pgvector search'] });

    // 4 Standards matching
    const qtext = translated.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ');
    const qtextStem = ' ' + Array.from(ex.set).join(' ') + ' ' + qtext + ' ';
    const scored = kb.list.filter(s => s.kind === 'product' || s.kind === 'code')
      .map(s => ({ std: s, ...scoreStandard(kb, s, ex.set, qtextStem, entities.attributes) }))
      .filter(r => r.raw > 0 && r.matched.length > 0)
      .sort((a, b) => b.sem - a.sem);
    const top = scored.length ? scored[0].sem : 0;
    const primaries = scored.filter(r => r.sem >= 0.30 && r.sem >= top * 0.65 && (r.phrases.length > 0 || r.matched.length >= 2 || r.raw >= 1.5)).slice(0, 5);

    const recs = new Map();
    const sentList = sentences(translated);
    for (const p of primaries) {
      const termSet = new Set(p.matched);
      const ev = sentList.map(s => ({ s, n: tokenize(s).filter(t => termSet.has(t)).length })).filter(x => x.n > 0)
        .sort((a, b) => b.n - a.n).slice(0, 2).map(x => segments(x.s, termSet));
      const reasons = [];
      const named = uniq(p.phrases.concat(p.matched.slice(0, 4)));
      reasons.push({ kind: 'semantic', text: 'The input describes ' + named.slice(0, 4).join(', ') + ', which matches the title and scope of ' + p.std.id + '.' });
      p.notes.forEach(n => reasons.push(n));
      recs.set(p.std.id, { id: p.std.id, roles: ['Primary'], score: p.sem, matched: p.matched, phrases: p.phrases, reasons, evidence: ev, paths: [], advisory: null });
    }
    // grade advisory
    const opcPrim = primaries.filter(p => p.std.grade && p.std.grade.family === 'opc');
    if (opcPrim.length > 1 && !entities.attributes.some(a => a.type === 'Cement grade')) {
      opcPrim.forEach(p => { recs.get(p.std.id).advisory = 'The input does not state a cement grade, so more than one grade-specific standard is listed. Confirm the grade before approving.'; });
    }
    stages.push({ key: 'match', label: 'Standards matching', summary: primaries.length + ' matched from ' + kb.list.filter(s => s.kind === 'product' || s.kind === 'code').length + ' candidates',
      details: [scored.length + ' candidate standard(s) with overlapping concepts', primaries.length + ' above the match threshold', primaries.length ? 'Top match: ' + primaries[0].std.id + ' (' + Math.round(primaries[0].sem * 100) + '%)' : 'No standard in the demo Knowledge Base matched this input'] });

    // 5 Recommendation (graph expansion, rank & filter, certifications)
    for (const p of primaries) {
      for (const rel of ['tests', 'safety', 'normative', 'related']) {
        for (const rid of p.std[rel] || []) {
          if (!kb.byId.has(rid)) continue;
          const role = REL_TO_ROLE[rel];
          let r = recs.get(rid);
          if (!r) { r = { id: rid, roles: [], score: null, matched: [], phrases: [], reasons: [], evidence: [], paths: [], advisory: null }; recs.set(rid, r); }
          if (!r.roles.includes(role)) r.roles.push(role);
          r.paths.push({ from: p.std.id, rel, text: REL_TEXT[rel] + ' ' + p.std.id });
        }
      }
    }
    recs.forEach(r => { r.roles.sort((a, b) => ROLE_ORDER.indexOf(a) - ROLE_ORDER.indexOf(b)); });
    const recList = Array.from(recs.values()).sort((a, b) => {
      const pa = a.roles[0] === 'Primary' ? 0 : 1, pb = b.roles[0] === 'Primary' ? 0 : 1;
      if (pa !== pb) return pa - pb;
      if (pa === 0) return (b.score || 0) - (a.score || 0);
      const ra = ROLE_ORDER.indexOf(a.roles[0]), rb = ROLE_ORDER.indexOf(b.roles[0]);
      if (ra !== rb) return ra - rb;
      if (b.paths.length !== a.paths.length) return b.paths.length - a.paths.length;
      return a.id.localeCompare(b.id, 'en', { numeric: true });
    });

    const certs = [];
    for (const r of recList) { const s = kb.byId.get(r.id); (s.cert || []).forEach(c => certs.push({ scheme: c.scheme, standard: s.id, note: c.note, item: s.item, title: s.title })); }
    stages.push({ key: 'rec', label: 'Recommendation', summary: recList.length + ' standards · ' + certs.length + ' certification mapping(s)',
      details: [recList.filter(r => r.roles[0] === 'Primary').length + ' recommended, ' + recList.filter(r => r.roles[0] !== 'Primary').length + ' allied, related or normative',
        'Ranked by match score, then by relationship type', certs.length + ' certification requirement(s) suggested from the Knowledge Base', 'Structured output generated with reasons and references'] });

    // 6 Verification
    const cited = entities.standards.map(c => verifyCitation(kb, c));
    const citedKeys = new Set(cited.filter(c => c.kbId).map(c => c.kbId));
    const citedNums = new Set(entities.standards.map(c => c.num));
    const missing = recList.filter(r => r.roles.some(x => x !== 'Related') && !citedKeys.has(r.id) && !citedNums.has(kb.byId.get(r.id).num)).map(r => r.id);
    const attention = cited.filter(c => c.status !== 'current').length;
    let total = 0, resolved = 0;
    for (const r of recList) { const s = kb.byId.get(r.id); for (const rel of ['tests', 'safety', 'normative', 'related']) for (const x of s[rel] || []) { total++; if (kb.byId.has(x)) resolved++; } }
    stages.push({ key: 'verify', label: 'Verification', summary: cited.length + ' cited · ' + attention + ' need attention · ' + missing.length + ' missing',
      details: [cited.length + ' standard reference(s) found in the input and checked against the Knowledge Base',
        cited.filter(c => c.status === 'outdated').length + ' outdated, ' + cited.filter(c => c.status === 'unknown').length + ' not in the Knowledge Base',
        missing.length + ' recommended standard(s) not referenced in the input', 'Cross-references resolved: ' + resolved + ' of ' + total] });

    return {
      id: 'A-' + Date.now().toString(36).toUpperCase(),
      createdAt: new Date().toISOString(),
      input: { type, typeLabel, fileName: input.fileName || '', chars: raw.length, langHint: input.langHint || 'auto', parseMethod: input.parseMethod || 'Plain text' },
      text: { raw, cleaned, translated }, lang, didTranslate, untranslated, entities, intent,
      expansions: ex.expansions, stages, recs: recList, cited, missing, certs, crossRef: { resolved, total },
      kbVersion: input.kbVersion || ''
    };
  }

  function validateKBUpdate(json) {
    if (!json || !Array.isArray(json.standards)) return { ok: false, error: 'The file needs a "standards" array.' };
    const need = ['id', 'num', 'title', 'kind', 'version'];
    for (let i = 0; i < json.standards.length; i++) {
      const s = json.standards[i];
      const miss = need.filter(k => s[k] === undefined || s[k] === null || s[k] === '');
      if (miss.length) return { ok: false, error: 'Record ' + (i + 1) + ' is missing: ' + miss.join(', ') + '.' };
      if (!['product', 'code', 'test', 'safety'].includes(s.kind)) return { ok: false, error: 'Record ' + s.id + ' has an unknown kind "' + s.kind + '".' };
    }
    return { ok: true };
  }

  function normaliseRecord(s) {
    return Object.assign({ part: null, category: 'Uncategorised', history: [], amendments: [], scope: '', keywords: [], phrases: [], grade: null, item: null,
      related: [], normative: [], tests: [], safety: [], cert: [] }, s);
  }

  const api = { ROLE_ORDER, REL_TEXT, analyse, indexKB, validateKBUpdate, normaliseRecord, detectLanguage, translateHindi, extractCitations, verifyCitation, tokenize, cleanText };
  if (typeof module !== 'undefined') module.exports = api;
  return api;
})();

/* ===== Report generation (PDF / Excel) =====
   Libraries are loaded on demand from cdnjs. */
const Reports = (() => {
  const LIBS = {
    xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js'
  };
  const cache = {};
  function load(src) {
    if (!cache[src]) cache[src] = new Promise((res, rej) => {

async function startAnalysis() {

  S.input.error = null; const e = $('#inerr'); if (e) e.innerHTML = '';
  S.pending = Engine.analyse(S.kb, { text, type: S.input.type, fileName: S.input.fileName, langHint: S.input.langHint, parseMethod: S.input.fileName ? S.input.parseMethod : 'Plain text', kbVersion: kbVersion() });
  S.run = { active: true, stage: 0 };
  const btn = $('#runbtn'); if (btn) btn.disabled = true;
  for (let i = 0; i < 6; i++) { S.run.stage = i; renderPipeline(); await sleep(reduceMotion() ? 0 : 420); }
  S.analysis = S.pending; S.pending = null; S.approvals = {}; S.cost = {}; S.filter = 'all'; S.detailOpen = false;

  renderPage();
}

async function readFile(file) {
  const I = S.input; I.busy = true; I.error = null; renderPage();
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('lib')); document.head.appendChild(s); });
  try {
    const name = file.name.toLowerCase(); let text = '', method = '';
    if (name.endsWith('.txt')) { text = await file.text(); method = 'Plain text file'; }
    else if (name.endsWith('.docx')) { await load('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'); const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() }); text = r.value; method = 'DOCX text extraction'; }
    else if (name.endsWith('.pdf')) {
      await load('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; const parts = [];
      for (let p = 1; p <= pdf.numPages; p++) { const c = await (await pdf.getPage(p)).getTextContent(); let last = null, line = ''; for (const it of c.items) { const y = it.transform[5]; if (last !== null && Math.abs(y - last) > 3) { parts.push(line); line = ''; } line += it.str + ' '; last = y; } parts.push(line); parts.push(''); }
      text = parts.join('\n'); method = 'PDF text layer (' + pdf.numPages + ' pages)';
      if (text.replace(/\s/g, '').length < 20) throw new Error('nolayer');
    } else throw new Error('type');
    I.text = text; I.fileName = file.name; I.parseMethod = method;
  } catch (err) {
    I.error = err.message === 'nolayer' ? t('This PDF has no readable text layer. Scanned documents need the OCR service, which is not available in this prototype. Paste the text instead.') :
      err.message === 'type' ? t('Unsupported file type. Use PDF, DOCX or TXT.') : t('The file could not be read in this browser. Paste the text instead.');
  }
  I.busy = false; renderPage();
}

let recog = null;
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast(t('Voice input is not supported in this browser. Type or paste the requirement instead.')); return; }
  if (S.listening && recog) { recog.stop(); return; }
  recog = new SR(); recog.lang = S.input.langHint === 'hi' ? 'hi-IN' : 'en-IN'; recog.interimResults = false; recog.continuous = true;
  recog.onresult = ev => { let add = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) add += ev.results[i][0].transcript + ' '; if (add) { const ta = $('#spec'); S.input.text = (S.input.text + ' ' + add).trim(); if (ta) { ta.value = S.input.text; } const cc = $('#charcount'); if (cc) cc.textContent = S.input.text.length.toLocaleString('en-IN') + ' ' + t('characters'); } };
  recog.onerror = ev => { toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? t('Microphone access was blocked. Allow it in the browser to use voice input.') : t('Voice input stopped: ') + ev.error); };
  recog.onend = () => { S.listening = false; const b = $('#micbtn'); if (b) b.classList.remove('rec'); const l = $('#miclbl'); if (l) l.textContent = t('Voice input'); };
  try { recog.start(); S.listening = true; const b = $('#micbtn'); if (b) b.classList.add('rec'); const l = $('#miclbl'); if (l) l.textContent = t('Stop recording'); }
  catch (e) { toast(t('Voice input could not start.')); }
}

  try { dl = window.claude && await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) { await dl.save({ filename, data }); return 'saved'; }
  const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return 'link';
}
async function generate(fmt) {
  if (!S.analysis || S.busyReport) return;
  if (S.reportOpts.scope === 'approved' && !S.analysis.recs.some(r => app(r.id).status === 'approved')) { toast(t('No standards are approved yet. Approve at least one, or include all recommendations.')); return; }
  S.busyReport = true; renderPage();
  try {
    const ctx = { analysis: S.analysis, kb: S.kb, approvals: S.approvals, cost: S.cost, opts: S.reportOpts };
    const out = fmt === 'pdf' ? await Reports.pdf(ctx) : await Reports.excel(ctx);
    await saveOut(out.filename, out.data);
    S.reports.unshift({ name: out.filename, at: new Date().toLocaleString('en-IN'), scope: S.reportOpts.scope === 'approved' ? 'Approved standards only' : 'All recommendations' });
    toast(t('Report ready: ') + out.filename);
  } catch (e) {
    if (e && e.code === 'declined') toast(t('Download cancelled.'));
    else toast(t('The report could not be created. Check the network connection and try again.'));
  }
  S.busyReport = false; renderPage();
}

function applyKBUpdate(json) {
  const v = Engine.validateKBUpdate(json);
  if (!v.ok) { toast(t('Knowledge Base update rejected: ') + v.error); return; }
  const map = new Map(kbStandards.map(s => [s.id, s]));
  json.standards.forEach(s => map.set(s.id, Engine.normaliseRecord(s)));
  kbStandards = Array.from(map.values()); S.kb = Engine.indexKB(kbStandards); S.kbUpdates++;
  const un = S.kb.unresolved.length;
  toast(plural(json.standards.length, 'record') + ' ' + t('added or replaced.') + (un ? ' ' + plural(un, 'unresolved reference') + '.' : ''));
  renderPage();
}

function openRef(id) {
  if (S.view === 'recs' && recOf(id)) { S.sel = id; S.detailOpen = true; renderPage(); }
  else { S.view = 'standards'; S.stdSel = id; S.detailOpen = true; renderPage(); window.scrollTo(0, 0); }
}
function jump(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if (el.classList.contains('modal') && e.target !== el) return;
  switch (act) {
    case 'nav': go(el.dataset.view); break;
    case 'go-analysis': go('analysis'); break;
    case 'about': $('#modal').innerHTML = aboutModal(); break;
    case 'close-modal': $('#modal').innerHTML = ''; break;
    case 'input-type': S.input.type = el.dataset.type; renderPage(); break;
    case 'choose-file': { const f = $('#file'); if (f) f.click(); break; }
    case 'clear-input': S.input.text = ''; S.input.fileName = ''; S.input.error = null; renderPage(); break;
    case 'voice': toggleVoice(); break;
    case 'run': startAnalysis(); break;
    case 'dash-sample': { const s = SAMPLES.find(x => x.id === id); S.input = { ...S.input, type: s.type, text: s.text, langHint: s.lang, fileName: '', parseMethod: 'Plain text', error: null }; go('analysis'); break; }
    case 'select-rec': S.sel = id; S.detailOpen = true; if (S.view !== 'recs') S.view = 'recs'; renderPage(); break;
    case 'select-std': S.stdSel = id; S.detailOpen = true; renderPage(); break;
    case 'open-ref': openRef(id); break;
    case 'open-in-kb': S.view = 'standards'; S.stdSel = id; S.detailOpen = true; renderPage(); window.scrollTo(0, 0); break;
    case 'close-detail': S.detailOpen = false; renderPage(); break;
    case 'std-kind': S.stdKind = el.dataset.kind; renderPage(); break;
    case 'filter': S.filter = el.dataset.role; renderPage(); break;
    case 'approve': setStatus(id, 'approved'); break;
    case 'reject': setStatus(id, 'rejected'); break;
    case 'reset': S.approvals[id] = { status: 'pending', note: app(id).note || '' }; renderPage(); break;
    case 'approve-all': S.analysis.recs.forEach(r => { if (app(r.id).status === 'pending') S.approvals[r.id] = { status: 'approved', note: app(r.id).note || '', at: new Date().toISOString() }; }); renderPage(); toast(t('All pending standards approved.')); break;
    case 'jump': jump(el.dataset.target); break;
    case 'jump-recs': go('recs'); setTimeout(() => jump(el.dataset.target), 30); break;
    case 'gen': generate(el.dataset.fmt); break;
    case 'kb-update': { const f = $('#kbfile'); if (f) f.click(); break; }
    case 'kb-download': saveOut('ispectra-knowledge-base.json', JSON.stringify({ meta: { ...KB_META, version: kbVersion() }, standards: kbStandards }, null, 2)).then(() => toast(t('Knowledge Base file ready.'))).catch(() => toast(t('Download cancelled.'))); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action="select-rec"],[data-action="select-std"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { if ($('#modal') && $('#modal').innerHTML) $('#modal').innerHTML = ''; else if (S.detailOpen) { S.detailOpen = false; renderPage(); } }
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
  if (b === 'text') { S.input.text = e.target.value; const c = $('#charcount'); if (c) c.textContent = S.input.text.length.toLocaleString('en-IN') + ' ' + t('characters'); }
  else if (b === 'stdq') { S.stdq = e.target.value; renderStdList(); }
  else if (b === 'remark') { const id = e.target.dataset.id; S.approvals[id] = { ...app(id), note: e.target.value }; }
  else if (b === 'cost') {
    const id = e.target.dataset.id; S.cost[id] = { ...(S.cost[id] || {}), [e.target.dataset.field]: e.target.value };
    const cp = primaries().filter(r => std(r.id).item); cp.forEach((r, i) => { const c = S.cost[r.id] || {}; const cell = $('#amt-' + i); if (cell) cell.textContent = fmtINR((+c.qty || 0) * (+c.rate || 0)); });
    const tot = $('#cost-total'); if (tot) tot.innerHTML = '<b>' + esc(fmtINR(costTotal())) + '</b>';
  }
});
document.addEventListener('change', e => {
  const el = e.target; const b = el.dataset && el.dataset.bind;
  if (el.id === 'file' && el.files[0]) { readFile(el.files[0]); el.value = ''; return; }
  if (el.id === 'kbfile' && el.files[0]) { el.files[0].text().then(tx => { try { applyKBUpdate(JSON.parse(tx)); } catch (err) { toast(t('Knowledge Base update rejected: ') + t('the file is not valid JSON.')); } }); el.value = ''; return; }
  if (!b) return;
  if (b === 'uilang') { S.uiLang = el.value; LANG = el.value; try { localStorage.setItem('ispectra-lang', LANG); } catch (x) {} renderShell(); }
  else if (b === 'langhint') S.input.langHint = el.value;
  else if (b === 'scope') { S.reportOpts.scope = el.value; renderPage(); }
  else if (b === 'sample' && el.value) { const s = SAMPLES.find(x => x.id === el.value); S.input = { ...S.input, type: s.type, text: s.text, langHint: s.lang, fileName: '', parseMethod: 'Plain text', error: null }; renderPage(); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); } });

try { const l = localStorage.getItem('ispectra-lang'); if (l && I18N[l]) { S.uiLang = l; LANG = l; } } catch (e) {}
renderShell();
})();


</script>
</body>
